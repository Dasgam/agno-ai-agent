services:
  document-sandbox:
    image: agno-document-sandbox:3.2
    build:
      context: .
      dockerfile: worker/Dockerfile
    profiles: ["build-only"]
    network_mode: "none"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
