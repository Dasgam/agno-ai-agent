services:
  document-sandbox:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    user: "${SANDBOX_UID:-1000}:${SANDBOX_GID:-1000}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ./agent/data/sandbox_spool/inbox:/work/inbox:ro
      - ./agent/data/sandbox_spool/outbox:/work/outbox:rw
