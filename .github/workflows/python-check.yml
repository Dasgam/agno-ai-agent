
name: Python checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest python-dotenv markdown-it-py pypdf python-docx

      - name: Syntax check
        run: python -m compileall -q agent worker

      - name: Security and Markdown unit tests
        run: python -m pytest -q tests
