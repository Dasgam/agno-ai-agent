name: Python checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: python -m pip install pytest markdown-it-py pypdf python-docx
      - name: Syntax check
        run: python -m compileall -q agent worker
      - name: Security and Markdown unit tests
        run: python -m pytest -q tests
